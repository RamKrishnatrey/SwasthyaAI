name: SwasthyaAI Agent v2 tests

on:
  push:
    branches: [feat/complete-ai-agent-additions]
    paths:
      - "ai_agent_v2/**"
      - ".github/workflows/agent-v2-tests.yml"
  pull_request:
    paths:
      - "ai_agent_v2/**"
      - ".github/workflows/agent-v2-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_agent_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai_agent_v2/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app.py train.py tests
      - name: Run API and safety tests
        run: python -m pytest -q
