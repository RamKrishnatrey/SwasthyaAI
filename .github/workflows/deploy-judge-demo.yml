name: Deploy SwasthyaAI judge demo

on:
  push:
    branches: [fix/swasthyaai-chat-flow]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-judge-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build clearly labelled judge demo
        run: npm run build -- --base=/SwasthyaAI/
        env:
          VITE_DEMO_MODE: "true"
          VITE_API_BASE_URL: ""
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
