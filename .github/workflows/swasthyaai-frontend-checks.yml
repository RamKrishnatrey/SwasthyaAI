name: SwasthyaAI frontend checks

on:
  pull_request:
    branches: [main, jury-demo-backend2-integration]
  push:
    branches: [fix/swasthyaai-chat-flow]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
