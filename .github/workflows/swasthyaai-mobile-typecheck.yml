name: SwasthyaAI mobile typecheck

on:
  pull_request:
    branches: [main, jury-demo-backend2-integration]
  push:
    branches: [fix/swasthyaai-chat-flow]

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit
